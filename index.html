  <meta name="color-scheme" content="light dark">
  <title>바이브코딩의 모든 것</title>

  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  <div class="scroll-progress" aria-hidden="true"><div class="scroll-progress__fill" data-progress></div></div>
  <header class="site-header" data-header>
    <div class="container header-inner">
      <a class="brand" href="#top" aria-label="강의 처음으로">
        <span class="brand-mark" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v15M3 4h5a4 4 0 0 1 4 2 4 4 0 0 1 4-2h5v14h-5a4 4 0 0 0-4 2 4 4 0 0 0-4-2H3Z"/></svg>
        </span>
        <span class="brand-title" data-lecture-title></span>
      </a>
      <!-- shared.js가 본문의 .lecture-section을 수집해 링크를 생성합니다. -->
      <nav class="section-nav" aria-label="강의 섹션" data-section-nav></nav>
      <div class="header-actions">
        <button class="button" type="button" data-presentation-toggle>발표 모드 <kbd>P</kbd></button>

        </button>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1"><div class="container"><section class="hero" id="top"><h1>바이브코딩의 모든 것</h1><p class="hero-subtitle">만들고, 꾸미고, 저장하고, 함께 사용하는 프로젝트 수업.</p><p><a href="lesson-01/index.html">1회 · 내 게임을 우리 반 서비스로</a></p><p><a href="lesson-02/index.html">2회 · 우리 학교 축제 운영 서비스</a></p><p><a href="lesson-03/index.html">3회 · 일하는 동아리 자동 비서</a></p><p><a href="lesson-04/index.html">4회 · 우리 학교 분실물 센터</a></p><p><a href="lesson-05/index.html">5회 · 우리 학교 정보 도우미</a></p><p>6개 프로젝트로 아이디어를 서비스로 만듭니다. 현재 1~5회가 열려 있습니다.</p></section></div></main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <div class="footer-instructor">
        <div data-instructor-avatar></div>
        <div>
          <strong data-instructor-name></strong>
          <p data-instructor-affiliation></p>
          <a class="footer-email" data-instructor-email></a>
        </div>
      </div>
      <div data-other-lectures-region>
        <h2 class="footer-heading">다른 강의 둘러보기</h2>
        <div class="other-lectures" data-other-lectures></div>
      </div>
    </div>
  </footer>
  <!-- 선생님 소개 모달의 내용은 shared.js가 SITE.instructor로 한 번만 생성합니다. -->
  <div class="sr-only" role="status" aria-live="polite" data-copy-status></div>
  <noscript>강의 정보와 인터랙션을 표시하려면 브라우저에서 JavaScript를 켜 주세요.</noscript>
